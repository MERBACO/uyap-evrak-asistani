<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Duruşmalar — UYAP Dosyalama ve Evrak Asistanı</title>
<style>
  :root {
    --ink: #16202e; --ink-2: #5c6b7a; --line: #dce3ea;
    --paper: #fff; --tint: #f4f7fa; --seal: #93221f; --ok: #1f6b4a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font: 400 13px/1.45 -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  }
  header {
    display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px;
    padding: 16px 24px 12px; background: var(--tint); border-bottom: 1px solid var(--line);
  }
  .eyebrow { font-size: 10px; font-weight: 700; letter-spacing: .18em; color: var(--seal); }
  h1 { margin: 2px 0 0; font-size: 18px; font-weight: 600; }
  .alt { margin: 4px 0 0; color: var(--ink-2); font-size: 12px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  button {
    padding: 6px 12px; border: 1px solid var(--line); border-radius: 3px;
    background: var(--paper); color: var(--ink); font: inherit; cursor: pointer;
  }
  button:hover { border-color: var(--ink-2); }
  .primary { background: var(--ink); border-color: var(--ink); color: #fff; }
  main { padding: 16px 24px 32px; }
  .bos { color: var(--ink-2); }
  .tablo-kap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 6px 8px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
  th { position: sticky; top: 0; background: var(--paper); font-size: 11.5px; color: var(--ink-2); font-weight: 600; white-space: nowrap; }
  td.no, td.saat, td.tarih { white-space: nowrap; font-variant-numeric: tabular-nums; }
  td.saat { font-weight: 600; }
  tr.gun td {
    padding-top: 14px; background: var(--paper); border-bottom: 2px solid var(--ink);
    font-weight: 600; font-size: 12.5px;
  }
  tr.bugun td.saat { color: var(--seal); }
  .soluk { color: var(--ink-2); font-size: 12px; }
  :focus-visible { outline: 2px solid var(--seal); outline-offset: 2px; }
  @media print {
    header { background: none; border: 0; padding: 0 0 8px; }
    .row { display: none; }
    main { padding: 0; }
    th { position: static; }
    tr { break-inside: avoid; }
    body { font-size: 10.5px; }
  }
</style>
</head>
<body>
<header>
  <div>
    <div class="eyebrow">UYAP DOSYALAMA VE EVRAK ASİSTANI</div>
    <h1 id="baslik">Duruşmalar</h1>
    <p class="alt" id="alt"></p>
  </div>
  <div class="row">
    <button type="button" id="excel">Excel'e Aktar</button>
    <button type="button" class="primary" id="yazdir">Yazdır</button>
  </div>
</header>
<main>
  <p class="bos" id="bos" hidden></p>
  <div class="tablo-kap">
    <table id="tablo" hidden>
      <thead>
        <tr><th>No</th><th>Tarih</th><th>Saat</th><th>Birim</th><th>Dosya No</th><th>Dosya Türü</th><th>İşlem</th><th>Müvekkil</th><th>Diğer Taraflar</th></tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
</main>
<script src="durusmalar.js" type="module"></script>
</body>
</html>
